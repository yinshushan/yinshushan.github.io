<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>予茶选茶页设计 QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; background: #e9e4d9; color: #17231e; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 6px; font: 400 26px/1.3 "Songti SC", serif; }
      p { margin: 0 0 22px; color: #657068; font-size: 12px; }
      main { display: flex; align-items: flex-start; gap: 24px; }
      figure { width: 300px; margin: 0; }
      figcaption { margin-bottom: 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
      img { display: block; width: 300px; height: auto; border-radius: 16px; box-shadow: 0 14px 36px rgba(13,43,33,.14); }
    </style>
  </head>
  <body>
    <h1>选茶页设计 QA 对比</h1>
    <p>左侧分级菜单参考图一，悬浮购物车与固定底栏参考图三；商品分类与名称来自用户提供的价格表。</p>
    <main>
      <figure><figcaption>REFERENCE · 左侧菜单</figcaption><img src="/qa/reference-shop-menu.png" alt="左侧菜单参考" /></figure>
      <figure><figcaption>REFERENCE · 购物车与底栏</figcaption><img src="/qa/reference-shop-cart.png" alt="购物车与底栏参考" /></figure>
      <figure><figcaption>IMPLEMENTATION · 予茶选品</figcaption><img src="/qa/implementation-shop.png" alt="予茶选茶页实现" /></figure>
    </main>
  </body>
</html>
