<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>予茶首页视觉对比</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 36px; background: #e9e4d9; color: #17231e; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font: 400 28px/1.3 "Songti SC", serif; }
      p { margin: 0 0 28px; color: #657068; font-size: 13px; }
      main { display: flex; align-items: flex-start; gap: 32px; }
      figure { width: 393px; margin: 0; }
      figcaption { margin-bottom: 10px; font-size: 12px; font-weight: 650; letter-spacing: .08em; }
      img { display: block; width: 393px; height: auto; border-radius: 18px; box-shadow: 0 16px 40px rgba(13,43,33,.14); }
    </style>
  </head>
  <body>
    <h1>首页设计 QA 对比</h1>
    <p>参考图仅作风格与首屏结构依据；实现内容已重新设计为“数字化转型的新茶道”。</p>
    <main>
      <figure><figcaption>REFERENCE · 393 × 740</figcaption><img src="/qa/reference-normalized.png" alt="用户提供的参考首页" /></figure>
      <figure><figcaption>IMPLEMENTATION · 393 × 852</figcaption><img src="/qa/implementation-home.png" alt="予茶小程序首页实现" /></figure>
    </main>
  </body>
</html>
